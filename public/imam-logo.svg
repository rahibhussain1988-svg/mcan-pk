  <path d="M 120 26 Q 52 26 40 90 Q 40 145 75 188" fill="none" stroke="#0062B1" stroke-width="6" stroke-linecap="round" />
  <path d="M 120 26 Q 188 26 200 90 Q 200 145 165 188" fill="none" stroke="#E30613" stroke-width="6" stroke-linecap="round" />
  <path d="M 75 188 Q 120 228 120 228" fill="none" stroke="#E30613" stroke-width="6" stroke-linecap="round" />
  <path d="M 165 188 Q 120 228 120 228" fill="none" stroke="#0062B1" stroke-width="6" stroke-linecap="round" />

